services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: koeki
      POSTGRES_USER: koeki
      POSTGRES_PASSWORD: koeki
    ports:
      - "5432:5432"
    volumes:
      - koeki-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koeki -d koeki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  koeki-postgres-data:

