name: Kōeki navigation investigation
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: navigation-investigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolate:
    strategy:
      fail-fast: false
      matrix:
        candidate: [revalidation, root-dynamic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: koeki_v2_test
          POSTGRES_USER: koeki
          POSTGRES_PASSWORD: koeki-local-fixture
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U koeki -d koeki_v2_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://koeki:koeki-local-fixture@127.0.0.1:5432/koeki_v2_test?schema=public
      DATABASE_URL_TEST: postgresql://koeki:koeki-local-fixture@127.0.0.1:5432/koeki_v2_test?schema=public
      DEMO_MODE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      pnpm_config_verify_deps_before_run: "false"
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated hypothesis on the disposable runner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('apps/web/next.config.ts')
          p.write_text(p.read_text().replace('  compress: false,\n',''))
          if os.environ['CANDIDATE']=='root-dynamic':
              p=Path('apps/web/app/layout.tsx')
              s=p.read_text().replace('import { connection } from "next/server";\n','')
              s=s.replace('export default async function RootLayout','export const dynamic = "force-dynamic";\n\nexport default function RootLayout')
              assert '  await connection();' in s
              p.write_text(s.replace('  await connection();\n',''))
          else:
              p=Path('apps/web/app/(app)/ninjas/actions.ts')
              s=p.read_text().replace('import { redirect } from "next/navigation";', 'import { redirect } from "next/navigation";\nimport { revalidatePath } from "next/cache";')
              old='\n  redirect(`/ninjas/${ninjaId}`);\n}\n\nexport async function restoreNinja'
              assert s.count(old)==1
              s=s.replace(old,'\n  revalidatePath(`/ninjas/${ninjaId}`);\n  revalidatePath("/ninjas");'+old)
              p.write_text(s)
              p=Path('apps/web/app/(app)/equipement/actions.ts')
              s=p.read_text().replace('import { redirect } from "next/navigation";', 'import { redirect } from "next/navigation";\nimport { revalidatePath } from "next/cache";')
              anchor='  redirect(`/equipement?info='
              assert s.count(anchor)==1
              p.write_text(s.replace(anchor,'  revalidatePath("/equipement");\n'+anchor))
          PY
          git diff --stat
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:generate
      - run: corepack pnpm db:deploy
      - run: corepack pnpm build
      - run: corepack pnpm --filter @koeki/web exec playwright install --with-deps chromium
      - run: corepack pnpm --filter @koeki/web exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investigation-${{ matrix.candidate }}
          path: apps/web/test-results/production/
