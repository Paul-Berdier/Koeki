services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: koeki_v2_test
      POSTGRES_USER: koeki
      POSTGRES_PASSWORD: koeki-local-fixture
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koeki -d koeki_v2_test"]
      interval: 2s
      timeout: 3s
      retries: 30
